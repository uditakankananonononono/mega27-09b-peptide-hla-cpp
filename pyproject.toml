[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peptidehlacpp"
version = "0.1.0"
description = "Peptide-HLA binding prediction and CPP design (MEGA27 item 9b)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "torch", "scikit-learn", "biopython", "networkx"]

[tool.setuptools.packages.find]
where = ["src"]
